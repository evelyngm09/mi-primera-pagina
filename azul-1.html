<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Azul</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color:azul-1.html/* Fondo oscuro */
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 30 px;
            text-align: center;
        }

        /* BOTÓN DE REGRESO A INICIO */
        .btn-regreso {
            display: inline-flex;
            align-items: center;
            gap: 10 px;
            background: linear-gradient (135 deg, #e65c00, #f9d423); /* Botón de color degradado */
            color: white;
            text-decoration: none;
            padding: 12 px 24 px;
            border-radius: 8 px;
            font-weight: bold;
            font-size: 16 px;
            margin-bottom: 30 px;
            box-shadow: 0 4 px 8 px rgba (0,0,0,0.3);
            transition: transform 0.2 s;
        }

        .btn-regreso:hover {
            transform: translateY (-2 px);
        }

        .content-card {
            background-color: #2a344d;
            padding: 40 px;
            border-radius: 15 px;
            max-width: 600 px;
            margin: 0 auto;
            box-shadow: 0 8 px 16 px rgba (0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- BOTÓN QUE REGRESA A TU INDEX.HTML -->
    <a href="index.html" class="btn-regreso">
        <i class="fa-solid fa-arrow-left"></i> Volver a la Página Principal
    </a>

    <!-- CONTENIDO DE ESTA PÁGINA -->
    <div class="content-card">
        <h1>Página Azul</h1>
        <p>Esta es la sección azul. Aquí puedes colocar la información o contenido que quieras mostrar en este apartado.</p>
    </div>

</body>
</html>
