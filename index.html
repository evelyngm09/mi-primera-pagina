<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Página</title>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ESTILOS CSS PARA LOS BOTONES Y DISEÑO -->
    <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1e2638;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20 px;
        }

        /* BARRA SUPERIOR DE BOTONES */
        .navbar {
            display: flex;
            justify-content: center;
            gap: 12 px;
            background-color: #121722;
            padding: 15 px;
            border-radius: 12 px;
            flex-wrap: wrap;
            margin-bottom: 30 px;
            box-shadow: 0 4 px 10 px rgba (0,0,0,0.4);
        }

        /* ESTILO DE CADA BOTÓN REDONDEADO */
        .btn-nav {
            background: linear-gradient (135 deg, #e65c00, #f9d423); /* Degradado Naranja/Rojo */
            color: white;
            text-decoration: none;
            padding: 10 px 18 px;
            border-radius: 8 px;
            font-size: 13 px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8 px;
            transition: transform 0.2 s;
        }

        .btn-nav:hover {
            transform: translate Y (-2 px);
            opacity: 0.9;
        }

        /* CONTENIDO PRINCIPAL */
        .main-container {
            max-width: 1000 px;
            margin: 0 auto;
            text-align: center;
        }

        .main-title {
            margin-bottom: 20 px;
            font-size: 20 px;
        }

        /* ESTILO PARA TUS IMÁGENES DE PERFIL */
        .image-container {
            display: flex;
            justify-content: center;
            gap: 20 px;
            flex-wrap: wrap;
            margin-top: 20 px;
        }

        .profile-img {
            border-radius: 15 px;
            box-shadow: 0 8 px 16 px rgba (0,0,0,0.3);
            max-width: 100 %;
            height: auto;
        }
    </style>
</head>
<body>

    <!-- BARRA DE BOTONES (Tus enlaces convertidos en botones con iconos) -->
    <nav class="navbar">
        <a href="azul-1.html" class="btn-nav"><i class="fa-solid fa-house"></i> Azul</a>
        <a href="verde-2.html" class="btn-nav"><i class="fa-solid fa-download"></i> Verde</a>
        <a href="amarillo-3.html" class="btn-nav"><i class="fa-solid fa-magnifying-glass"></i> Amarillo</a>
        <a href="Principal-4.html" class="btn-nav"><i class="fa-solid fa-star"></i> Principal</a>
    </nav>

    <!-- CONTENIDO DE TU PÁGINA -->
    <main class="main-container">
        <p class="main-title">¡Bienvenidos a mi primera página! Soy Evelyn González y me gustan los kdramas...</p>

        <h2>Principal (index)</h2>

        <!-- TUS IMÁGENES DE PERFIL Y TABLA DE VIRTUDES -->
        <div class="image-container">
            <img src="IMG_20260609_192320445_MFN.jpg" width="300" alt="Imagen personal" class="profile-img">
            <img src="Captura de pantalla 2026-09-26 001634.png" width="500" alt="Tabla Virtudes y Defectos" class="profile-img">
        </div>
    </main>

</body>
</html>
